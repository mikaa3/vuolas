<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#0d1626"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="420" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.4">VUOLAS · SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>
  <text x="928" y="38" fill="#64748b" font-size="11" text-anchor="end">Serverless · $0/mo · CC BY 4.0</text>
  <line x1="32" y1="52" x2="928" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- Column Headers -->
  <text x="32" y="78" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.8">1. OPEN DATA SOURCES</text>
  <text x="352" y="78" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.8">2. BUILD &amp; SERVERLESS EDGE</text>
  <text x="676" y="78" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.8">3. BROWSER CLIENT RUNTIME</text>

  <!-- Connectors -->
  <!-- GIS Build (Amber) -->
  <path d="M 272 132 C 308 132, 312 132, 346 132" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-amber)"/>
  <path d="M 272 222 C 310 222, 310 148, 346 148" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-amber)"/>
  <path d="M 480 174 L 480 194" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>

  <!-- Hourly Cron (Purple) -->
  <path d="M 272 240 C 312 240, 312 325, 346 325" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <path d="M 614 325 C 646 325, 644 148, 670 148" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <path d="M 614 338 C 645 338, 645 332, 670 332" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-purple)"/>

  <!-- Edge Static Delivery (Cyan) -->
  <path d="M 614 234 C 645 234, 645 130, 670 130" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <path d="M 272 332 C 450 392, 620 205, 670 160" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4,4" opacity="0.7" marker-end="url(#arr-cyan)"/>
  <path d="M 802 174 L 802 194" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>

  <!-- COL 1 CARDS -->
  <g transform="translate(32, 94)">
    <rect width="240" height="78" rx="10" fill="#111c2d" stroke="#334155"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">SYKE Uomaverkosto</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Uoma10 + Solmupisteet (EPSG:3067)</text>
    <text x="14" y="63" fill="#fbbf24" font-size="10.5" font-family="monospace">25,504 rivers · 17,074 lake lines</text>
  </g>

  <g transform="translate(32, 194)">
    <rect width="240" height="78" rx="10" fill="#111c2d" stroke="#334155"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">SYKE Hydrologiarajapinta</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">OData v1.1 · Paikka &amp; Virtaama (m³/s)</text>
    <text x="14" y="63" fill="#c084fc" font-size="10.5" font-family="monospace">~420 active gauges · HARICA TLS</text>
  </g>

  <g transform="translate(32, 294)">
    <rect width="240" height="78" rx="10" fill="#111c2d" stroke="#334155"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">OpenFreeMap Vector Tiles</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Keyless OpenStreetMap dark basemap</text>
    <text x="14" y="63" fill="#38bdf8" font-size="10.5" font-family="monospace">tiles.openfreemap.org</text>
  </g>

  <!-- COL 2 CARDS -->
  <g transform="translate(352, 94)">
    <rect width="262" height="78" rx="10" fill="#111c2d" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">Offline GIS + Tippecanoe</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Graph areas (km²) · 15y percentiles</text>
    <text x="14" y="63" fill="#fbbf24" font-size="10.5" font-family="monospace">build_network.py → 2,110 .pbf tiles</text>
  </g>

  <g transform="translate(352, 198)">
    <rect width="262" height="78" rx="10" fill="#111c2d" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">Cloudflare Pages Edge</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Static SPA + /data/tiles/{z}/{x}/{y}.pbf</text>
    <text x="14" y="63" fill="#38bdf8" font-size="10.5" font-family="monospace">vuolas.pages.dev · HTTP/3 + Brotli</text>
  </g>

  <g transform="translate(352, 294)">
    <rect width="262" height="78" rx="10" fill="#111c2d" stroke="#c084fc" stroke-opacity="0.55"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">GitHub Action → live-data</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Hourly cron (:14) · 1-commit orphan CDN</text>
    <text x="14" y="63" fill="#c084fc" font-size="10.5" font-family="monospace">latest_flows.json (90 KB) · CORS</text>
  </g>

  <!-- COL 3 CARDS -->
  <g transform="translate(676, 94)">
    <rect width="252" height="78" rx="10" fill="#111c2d" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">MapLibre WebGL Join</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Joins station_id → Q = Area × r / 1000</text>
    <text x="14" y="63" fill="#38bdf8" font-size="10.5" font-family="monospace">Percentile / Volume / None</text>
  </g>

  <g transform="translate(676, 198)">
    <rect width="252" height="78" rx="10" fill="#111c2d" stroke="#334155"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">60 FPS Flow-Comet Canvas</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">HiDPI downstream droplets scaled by Q</text>
    <text x="14" y="63" fill="#67e8f9" font-size="10.5" font-family="monospace">Float32Array · 0 project()/frame</text>
  </g>

  <g transform="translate(676, 294)">
    <rect width="252" height="78" rx="10" fill="#111c2d" stroke="#334155"/>
    <text x="14" y="25" fill="#f8fafc" font-size="13" font-weight="700">Hydrographs &amp; Metrics UI</text>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">Lazy-loads station_series.json (251 KB)</text>
    <text x="14" y="63" fill="#c084fc" font-size="10.5" font-family="monospace">30d SVG charts · Basin report</text>
  </g>

  <!-- Legend Footer -->
  <circle cx="40" cy="398" r="4" fill="#fbbf24"/>
  <text x="50" y="402" fill="#94a3b8" font-size="11">One-time offline GIS build</text>
  <circle cx="230" cy="398" r="4" fill="#c084fc"/>
  <text x="240" y="402" fill="#94a3b8" font-size="11">Hourly live flow JSON sync</text>
  <circle cx="425" cy="398" r="4" fill="#38bdf8"/>
  <text x="435" y="402" fill="#94a3b8" font-size="11">Edge static tile &amp; client WebGL flow</text>
</svg>

name: Deploy to GitHub Pages (Zero-Account Alternative)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Refresh live SYKE flow data
        run: |
          uv sync
          uv run python scripts/fetch_live_flows.py
          mkdir -p web/public/data
          cp data/live/latest_flows.json data/live/station_series.json web/public/data/

      - name: Build Vite frontend
        working-directory: web
        run: |
          npm ci
          npx vite build --base="./"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v5

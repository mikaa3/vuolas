name: Update Live SYKE River Flows

on:
  schedule:
    - cron: "14 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'vuolas-data' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Fetch latest SYKE Virtaama & compute percentiles
        run: uv run python scripts/fetch_live_flows.py

      - name: Publish JSON snapshots to orphan live-data branch (Zero-Card CDN)
        run: |
          WORK_TMP="$(mktemp -d)"
          cp data/live/latest_flows.json data/live/station_series.json "${WORK_TMP}/"
          cd "${WORK_TMP}"
          git init -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_flows.json station_series.json
          git commit -m "Update live SYKE river flows ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data:live-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JSON snapshots to Cloudflare R2 (Optional)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws s3 cp data/live/latest_flows.json "s3://${R2_BUCKET_NAME}/latest_flows.json" \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --content-type "application/json" \
            --cache-control "public, max-age=1800"
          aws s3 cp data/live/station_series.json "s3://${R2_BUCKET_NAME}/station_series.json" \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --content-type "application/json" \
            --cache-control "public, max-age=1800"
